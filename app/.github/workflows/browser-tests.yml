name: Browser Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            browser_test_path:
                description: 'Path to test (e.g., /user/sign-in)'
                required: false
                default: '/'

env:
    DATABASE_URL: ${{ secrets.DATABASE_URL }}
    PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_CLERK_PUBLISHABLE_KEY }}
    CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
    EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    BROWSER_TEST_PATH: ${{ github.event.inputs.browser_test_path || '/' }}

jobs:
    test-chrome:
        name: Chrome
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - name: Start dev server
              run: npm run dev &
            - name: Wait for server
              run: |
                  npx wait-on tcp:4321 --timeout 60000
                  sleep 5
            - run: npm run test:nopause:chrome
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report-chrome
                  path: playwright-report/
                  retention-days: 7

    test-firefox:
        name: Firefox
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - run: npm ci
            - run: npx playwright install --with-deps firefox
            - name: Start dev server
              run: npm run dev &
            - name: Wait for server
              run: |
                  npx wait-on tcp:4321 --timeout 60000
                  sleep 5
            - run: npm run test:nopause:firefox
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report-firefox
                  path: playwright-report/
                  retention-days: 7

    test-safari:
        name: Safari
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - run: npm ci
            - run: npx playwright install --with-deps webkit
            - name: Start dev server
              run: npm run dev &
            - name: Wait for server
              run: |
                  npx wait-on tcp:4321 --timeout 60000
                  sleep 5
            - run: npm run test:nopause:safari
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report-safari
                  path: playwright-report/
                  retention-days: 7
